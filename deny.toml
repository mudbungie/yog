# cargo-deny supply-chain policy for yog.
#
# Verified against cargo-deny 0.20.2 (pin CI to this exact version). The
# allow-list below is empirically derived from `cargo deny list` over the
# committed Cargo.lock — every license that actually appears in the tree,
# nothing speculative. Re-run `cargo deny check` after any dependency change
# and fix drift here by config, never by patching dependencies.

[advisories]
# Reject crates whose published version has been yanked from the registry.
yanked = "deny"
# **The ignore list is empty, and that is a state to keep.** An entry that
# stops matching any crate makes `cargo deny check` warn `advisory-not-detected`
# on every gate run, so this list stays exactly as long as the tree justifies —
# which right now is not at all.
#
# Dropped when they stopped matching: RUSTSEC-2026-0194 / -0195 (quick-xml
# < 0.41 XML DoS), reached only via wayland-scanner, which moved to quick-xml
# 0.41.0; and RUSTSEC-2026-0192 (ttf-parser unmaintained), reached only through
# egui's font rasterizer, which left the graph with the window (bl-7942).
ignore = []

[licenses]
# Exhaustive allow-list for the current dependency graph. The slash-form
# "MIT OR Apache-2.0" style expressions are satisfied as long as at least
# one arm is allowed; the AND-joined expressions (see epaint_default_fonts)
# require every arm. LGPL-2.1-or-later appears only inside r-efi's
# "MIT OR Apache-2.0 OR LGPL-2.1-or-later" OR-expression, so MIT/Apache-2.0
# discharge it and no LGPL allow is needed.
#
# The embedded balls crate (§16.7 W8) added NO new license value: `balls`
# itself is MIT, and its transitive additions — toml, toml_edit,
# toml_datetime, toml_write, serde_spanned, winnow 0.7, getrandom 0.4 — are
# each "MIT OR Apache-2.0", both arms already allowed below.
#
# **Re-derived over the shrunken lockfile** (bl-7942). The severance took the
# eframe/egui/winit/glow stack out of the graph, and with it every license
# only that stack carried: `BSD-2-Clause`, `Zlib`, `0BSD` and `OFL-1.1` — plus
# the `epaint_default_fonts` exception, which existed for exactly one crate
# that is no longer linked. Each of those made `cargo deny check` warn
# `license-not-encountered` on every gate run, which is the warning telling you
# to drop the entry.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "Unicode-3.0",
    "BSD-3-Clause",
    "ISC",
    "BSL-1.0",
    "CC0-1.0",
    "Unlicense",
    # webpki-roots: the Mozilla CA root store as DATA, which is why it carries a
    # data licence rather than a code one. Entered the graph with brazen's
    # rustls transport (§16.7 W10) — it IS the trust anchor set that makes the
    # embedded adapter's TLS work with no OS/corporate store.
    "CDLA-Permissive-2.0",
]

# **No exceptions, and that is a state to keep.** The one that stood was
# `epaint_default_fonts`'s non-SPDX Ubuntu Font License — egui's bundled fonts,
# which left the graph with the window (bl-7942). An exception naming a crate
# nothing links is a `license-exception-not-encountered` warning on every run.
exceptions = []

[bans]
# Duplicate versions are informational (the transitive graph legitimately
# carries several); a bare "*" version requirement is a hard error.
multiple-versions = "warn"
wildcards = "deny"
# TLS stack ban, rustls-only. **Amended by §16.7 W10 (batteries included):**
# yog is no longer network-free — it embeds brazen, the LLM network adapter,
# so `ureq`/`rustls`/`ring`/`webpki-roots` are now load-bearing and the old
# "no TLS surface at all" adaptation is retired. What survives is the house
# standard's actual rule: rustls ONLY. OpenSSL (`openssl-sys`) and the system
# TLS bridge (`native-tls`) stay banned — a C toolchain dependency and a
# non-portable one, either of which would break the single-binary
# musl/macOS/Windows story rustls preserves.
#
# **`aws-lc-sys` joins them (bl-b6fa).** The REMOTE §9.5 wire made `rustls` a
# DIRECT dependency, and rustls' default features select `aws-lc-rs` — whose
# `aws-lc-sys` builds C. `Cargo.toml` takes `default-features = false` with
# `ring` for exactly that reason, but a manifest edit that dropped the flag
# would pull the C toolchain back in silently and no other gate would say so.
# Banning the sys crate makes that edit fail here instead, which is where the
# other two of these live. It matches nothing today, by design.
deny = [
    { crate = "openssl-sys" },
    { crate = "native-tls" },
    { crate = "aws-lc-sys" },
]

[sources]
# Every crate must come from a known registry (crates.io) — no unvetted
# registries and no ad-hoc git sources. The embedded substrate crates (DESIGN
# §16.7 — W8 balls, W10 brazen, W11 litany) are exact registry pins (`=x.y.z`)
# since bl-89a4.
#
# NO exception is in force, and there is deliberately no `allow-git` key here:
# an empty list is the same refusal, but a key present is a place for an entry
# to be added back quietly. bl-fd24 took the one §16.7 phase-2 interim
# exception (litany on an exact `git`/`rev` while its bl-ddaa injection-seam
# amendment was unpublished) and bl-f91a spent its named exit at litany 0.0.4,
# deleting the entry and Cargo.toml's git half together. `make publish` works.
