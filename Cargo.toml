[package]
name = "yog"
version = "0.0.6"
edition = "2024"
description = "yog: the standalone server for litany loops — the world, the balls and the conversations, behind one wire"
license = "MIT"
repository = "https://github.com/mudbungie/yog"
readme = "README.md"
keywords = ["litany", "agents", "server", "balls"]
categories = ["development-tools"]
# What ships to crates.io (bl-8340). An ALLOWLIST, and never an `exclude`: with
# `exclude`, every file class added tomorrow ships by DEFAULT, and that default
# is exactly how 0.0.1 published the operator's home paths across four files
# and three `docs/drive-logs/` transcripts — the manifest declared neither key,
# so `cargo publish` packaged the whole tree (AGENTS.md, "Before making the repo
# or a crate version public", item 6: *"`cargo publish` is irreversible: a
# yanked version stays downloadable"*). The asymmetry decides the shape: a
# missing entry here costs a build nobody can complete, which is loud and
# reversible; a missing `exclude` entry costs a publication that cannot be
# recalled.
#
# The list is the crate's own build inputs and the three files crates.io
# renders, and nothing else. `src/**` is the lib and the bin. Cargo adds
# `Cargo.toml`/`Cargo.lock` itself.
#
# **`assets/` left with the window** (bl-7942): the six PNGs and the SVG were
# the application mark, embedded by the icon generator's own test with
# `include_bytes!`/`include_str!`. A server draws nothing, so the whole
# directory and the generator behind it are the seat crate's.
#
# Deliberately absent, each because it is commentary or apparatus rather than
# source: `docs/**` (DESIGN, VISION, QUALITY, REMOTE, STORIES — architecture
# commentary on a private world, addressed to agents working in this repo, not
# documentation of a dependency), `tests/**`, `examples/**`, `scripts/**`
# (which includes `leak-fixtures/`, a directory of deliberately fabricated
# secrets), `rules/**`, `.github/**`, `.githooks/**`, `Makefile`, the four gate
# configs, and the agent guide (`AGENTS.md` and its `CLAUDE.md` symlink).
# `tests/packaged_files.rs` holds this shape in both directions, over the real
# `cargo package --list`.
#
# The leading `/` on the three bare filenames is load-bearing, and its absence
# was measured here: these are **gitignore-style** patterns, so a pattern with
# no slash matches that basename at ANY depth, and `README.md` alone shipped
# `scripts/leak-fixtures/README.md` — the index of the fabricated-secret corpus
# — out of a list that names no `scripts` entry. `src/**` contains a slash and
# is therefore already anchored to the package root; only a bare basename needs
# the `/`.
include = [
    "src/**",
    "/README.md",
    "/LICENSE",
    "/CHANGELOG.md",
]

[dependencies]
# The embedded balls substrate (DESIGN §16.7 W8): typed store reads in-process
# and the multiplexed `yog bl <verb>` CLI entry. EXACT registry pin — the pin IS
# the version mechanism (§16.5), and `=` makes the lockfile the single source of
# the version yog links, independent of any machine's checkout or installed `bl`
# (a `path` dep is never lawful, §16.7). 0.5.10 is the release that carries the
# **attempt capability** (upstream bl-4eac) and the source-owned reconciliation
# law it rides on (upstream bl-a1a4) — the two upstream sides VISION §4.10 item 9
# sequences yog's mutating fan behind (§3.7, bl-8746): `attempt::Attempt` mints a
# private source ref + index + worktree at an exact target commit, `Project::target`
# resolves the delivery target opaquely, and `Attempt::release`/`discard` separate
# worktree teardown from source-ref retention. It keeps everything 0.5.9 carried
# and the interim git revs were held for: the promoted typed read surface
# (`reads::Catalog`/`Entry`, `record::task_json`, W8) and the plugin-binary lib
# seam (`delivery_bin::run`/`tracker::run`, U-balls-3) the bl-2930 multiplex
# arms stand on — plus the current §7 plugin wire (`command.id`).
balls = "=0.5.11"
# The embedded LLM adapter (DESIGN §16.7 W10). EXACT pin: `native-host` re-exposes
# the `bz` bin's impure shim (ureq/rustls transport, XDG credential store + model
# cache) with NO semver contract, so the version is the contract — and the lockfile
# is the parity check that yog and litany resolve ONE brazen (§16.7 "skew death is
# structural"). 0.0.6 ships an eighth default provider row, `openai-chatgpt`
# (oauth2, no model prefixes, last in the table), so a bare install has a
# browser-login-capable provider with no config file authored (brazen bl-77fa,
# the ruling on yog bl-8c2d).
brazen = { version = "=0.0.6", features = ["native-host"] }
clap = { version = "4", features = ["derive"] }
# The embedded agent harness (DESIGN §16.7 W11): the multiplex arm `yog litany
# <argv…>` reproduces litany's own thin exec binding over `litany::cmd`, and the
# driver every spawn re-enters is yog itself. EXACT registry pin — track the
# published latest.
#
# **The name moved at a version fence (REMOTE §12, bl-9905).** This crate — the
# agent-loop engine — shipped as `lernie` through 0.0.11 and continues its line
# as `litany` from 0.0.1; the `lernie` name passes to the seat, whose line
# begins at 0.1.0. So a `lernie 0.0.x` in the notes below is THIS engine at that
# release, and every version citation in yog's tree reads against that one rule.
# 0.0.2 is **the inverted tool-injection seam** (upstream bl-a00a, its
# `docs/DESIGN_TOOL_INJECTION.md`), which REMOTE §5's one-pipeline ruling asked
# for: `ToolInjection::route` returns a `RoutedCapture` outright rather than an
# `Option`, and while an injection is installed it answers EVERY invocation the
# agent makes — the §3.3 three-hop binary resolution stands behind it for no
# name at all, so the engine's driver keeps no local executor. Two consequences
# land in yog's own router (`src/tool_host`, bl-dfce). A name yog does not own
# is a refusal yog *renders*, not a hand-back, which is what makes REMOTE §12's
# ship-inert posture literal. And litany's second source of injected
# definitions — the calling role's own procedure, today exactly the compactor's
# `write_summary` / `mark_for_deletion` — now reaches the router too; those two
# are engine acts on the conversation rather than tools on a machine, so yog
# answers them itself by re-entering the engine's front door (REMOTE §5.4).
# Atop that, 0.0.1 is 0.0.11 plus the rename itself — crate, binary, `LITANY_HOME`, the XDG
# harness subdir and the `refs/litany/*` mark namespace, with no compatibility
# shim (upstream bl-2f58, its `docs/DESIGN_ENGINE_RENAME.md`) — plus upstream
# bl-68f5, which stops §6 spend double-billing the cached prompt slice on the
# OpenAI-shaped and Google decoders, where the prompt counter already CONTAINS
# the cached one.
#
# Carried in from the lernie era, newest first. 0.0.11 carried the **two-word
# PascalCase mint**
# (bl-0219): upstream bl-79a2 draws an agent name as one ordered pair from a
# widened index space instead of the single lowercase word that read as a word
# and not a name — yog links `litany::mint::mint` directly
# (`src/start/identity.rs`) at both preview and fire, so it inherits the new
# shape with no code change. It also ships the workflow template with **budgets
# off by default** (upstream bl-8dea — the shipped whole-tree spend ceilings
# bound far too early on ordinary chats), and stops the compactor `git rm`ing
# the opening prompt the operator reads (upstream bl-898f: the prompt was
# written twice, as `goal.md` and as `messages/001-user.md`, so compaction saw
# duplication). Atop 0.0.10's two **chat-wedge fixes**
# (bl-4c1f): upstream bl-15f0 judges the §2.3 tool pairing over the WHOLE
# alternation when deriving a hop's warrant, so delivered mail behind a
# crash-orphaned tool window declines loudly instead of sending an orphan
# `tool_use` the provider 400s forever — the class yog's own bl-ace6
# orphaned-mail banner renders; and upstream bl-4187 settles a markless
# unpaired trailing window at the drive boundary (one in-band died
# `tool_result` per unanswered id, committed BEFORE delivery), so an ordinary
# deposit REVIVES a crashed chat and fork-from-history stops being the only
# recovery. Atop 0.0.9's **tool-injection seam** REMOTE §5
# stands on (upstream bl-9001, its `docs/DESIGN_TOOL_INJECTION.md`):
# `Fx::tool_injection` is one optional object holding both halves — the extra
# tool definitions prompt assembly and the grant gate read, and the router the
# executor consults ahead of §3.3 binary resolution — so a declaration and a
# permission cannot disagree. Adjudication is untouched and still runs first;
# an injected name outranks an elected one; the per-invocation disk record
# stays the executor's. yog's own injection is `src/tool_host` (bl-c907).
# Atop 0.0.8, the pin that keeps a conversation alive
# through an interrupted tool window (bl-976e): upstream bl-b98d settles a
# stopped window with one in-band `is_error` tool_result per unanswered
# `tool_use`, so a killed tool no longer leaves the unpaired tail that made
# every later message a provider 400 ("No tool output found for function call
# …") with no gesture able to revive the branch; and upstream bl-55f9 binds the
# detached driver's stderr to `steps/<agent>/driver.log` instead of
# `Stdio::null()`, so the next such death is legible instead of invisible. It
# also carries the mint (bl-404d), `--cwd` at spawn (bl-d0b4) and the retarget
# mark (bl-22a5), which bl-cd38 / bl-6654 / bl-2d19 are blocked on. Atop
# 0.0.6's dispatch skill plus the rewritten worker soul (a child's marching
# orders are now authored text, not a terse stub) and its child-terminal-deposit
# fix (a body-less child result no longer lands blank); atop 0.0.5's
# fork-dialog prune, where a child's dispatch commit
# no longer inherits the fork point's messages/**, summary/**, skills/**, so a
# child never reads the parent's tail instruction as its own marching orders
# (fixes the runaway-recursion incident), 0.0.4's agent naming (--name on
# dispatch, resolve-by-unique-living-name), delete verb, and usage telemetry,
# and 0.0.3's `Fx::adapter_target` (the injection W11 consumes); the interim git
# rev is retired (a git pin also cost yog its publishability, and cost it the
# rev itself once upstream rewrote `main`; the registry has neither failure
# mode). The lockfile is also the brazen parity check: litany 0.0.2 links
# `brazen =0.0.6`, the same exact version yog pins, so exactly ONE brazen
# resolves — skew death is structural otherwise (§16.7). The two pins move
# TOGETHER, in one change, for that reason.
litany = "=0.0.2"
libc = "0.2"
notify = "6"
# The REMOTE §9.5 wire's TLS (bl-b6fa, approved by operator ruling 2026-08-13).
# Already in the graph transitively behind brazen's `ureq`, so this **adds no
# crate** — `Cargo.lock` gains one line, yog's own dependency list, and nothing
# else; `deny.toml` needed no change because no license and no advisory moved.
# `default-features = false` is load-bearing: rustls' defaults would pull
# `aws-lc-rs`, a C-toolchain crypto provider, and the single-binary
# musl/macOS/Windows story is exactly what AGENTS.md rule 6 keeps by banning
# `openssl-sys` and `native-tls`. `ring` is the provider `ureq` already
# resolves, so one provider links, and yog names it outright rather than
# reading the process-global default (which panics when none is installed —
# rule 4). No `tokio`: the listener is synchronous `std::net` (rule 8 stays
# vacuous), and no `rcgen`: certificates are the operator's out-of-channel act
# (REMOTE §1.4), minted by `make wire-certs` shelling to `openssl`.
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
serde_json = "1"
thiserror = "2"

[dev-dependencies]
tempfile = "3"

[[bin]]
name = "yog"
path = "src/main.rs"

# rustc lint gate: the toolchain is pinned (rust-toolchain.toml), so any warning
# is a deliberate event, not toolchain drift — deny the lot.
[lints.rust]
warnings = "deny"

# Clippy gate. `pedantic` runs at deny with priority -1 so the specific
# allows/denies below (default priority 0) override the group. The allow-list is
# sanctioned and each entry justified; NEVER inline `#[allow]` — the
# no-lint-suppression ast-grep rule forbids it, this manifest is the only home.
[lints.clippy]
pedantic = { level = "deny", priority = -1 }

# Bootstrap five (Rust Bootstrap v3): owned signatures and self-describing errors
# are house style; the doc/must_use nags are advisory only.
needless_pass_by_value = "allow"   # owned params are a deliberate rule, not an oversight
module_name_repetitions = "allow"  # module-qualified type names read clearer than terse ones
missing_errors_doc = "allow"       # error enums are self-descriptive; no prose to duplicate
missing_panics_doc = "allow"       # prod is panic-free (restriction lints below) — nothing to note
must_use_candidate = "allow"       # advisory; not decorating every getter with #[must_use]

# Empirically warranted for this tree (measured B6 histogram). The three cast
# entries were justified by egui's colour and pixel arithmetic and outlived it
# (bl-7942): the remaining casts are the derivation's own — seconds and counts
# across `i64`/`usize`/`u64` — and the justification is restated here rather
# than left pointing at a stack this crate no longer links.
doc_markdown = "allow"             # proper-noun-dominated (yog/bl/bz/litany) — the nag is noise
cast_possible_truncation = "allow" # clock seconds and row counts across i64/usize are intentional
cast_sign_loss = "allow"           # ditto: non-negative i64 -> unsigned in age and spend arithmetic
cast_possible_wrap = "allow"       # ditto: usize<->isize index arithmetic
implicit_hasher = "allow"          # would force BuildHasher generics through internal APIs (rule 9)
similar_names = "allow"            # subjective; parallel local bindings are intentional

# Site-specific false positives (each genuinely wrong for this code, B6 fix wave).
struct_excessive_bools = "allow"   # Attention's 5 signals are orthogonal + co-firing, not a state machine (§6)
case_sensitive_file_extension_comparisons = "allow" # .md matches are on balls/yog-generated files — always lowercase by construction

# Restriction lints: prod code is panic-free and bounds-checked. These deny the
# panic family (unwrap/expect/panic!/todo!/unimplemented!), leftover `dbg!`, and
# unchecked indexing/string slicing. `clippy --all-targets -- -D warnings` (the
# gate) picks them up; the test carve-outs live in clippy.toml
# (allow-*-in-tests). Kept out of prod behaviour: locks use
# `unwrap_or_else(PoisonError::into_inner)`, fallible reads use `.get()`/`?`.
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
indexing_slicing = "deny"
string_slice = "deny"
