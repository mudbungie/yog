# ast-grep project config. Rules live in ./rules and are applied by
# `ast-grep scan` (see the `rules-audit` Makefile target).
#
# Pinned ast-grep: 0.44.1 (the version this repo's rules were authored and
# verified against — Rust tree-sitter node kinds `unsafe_block`,
# `function_modifiers`, `type_identifier`, and `identifier` were confirmed
# against that parser via `--debug-query`). Newer ast-grep is generally fine,
# but re-verify the node kinds if a rule ever stops matching after an upgrade.
#
# Enforcement scans `src` only (`ast-grep scan src`); rules/fixtures holds
# deliberate violations that a whole-tree scan would — correctly — flag.
ruleDirs:
  - rules
