# `unsafe` is confined to the single audited FFI wrapper
# `src/cli_outbound/sys.rs` (the SIGTERM in Stream's drop). Every other
# `unsafe` block or `unsafe fn` in the tree is an error: reach for safe std
# first, and if an irreducible FFI call is genuinely needed, add it to
# sys.rs (or extend this rule's `ignores`) so the whole-crate unsafe
# inventory stays auditable at one place.
#
# Node kinds verified against ast-grep 0.44.1's Rust tree-sitter parser:
#   - `unsafe { ... }`        -> node kind `unsafe_block`
#   - `unsafe fn` / modifiers -> node kind `function_modifiers` containing
#                                the `unsafe` keyword (regex `\bunsafe\b`)
id: unsafe-outside-sys
language: rust
severity: error
message: "unsafe is confined to src/cli_outbound/sys.rs (see rules/unsafe-outside-sys.yml)"
ignores:
  - "**/cli_outbound/sys.rs"
rule:
  any:
    - kind: unsafe_block
    - kind: function_modifiers
      regex: '\bunsafe\b'
