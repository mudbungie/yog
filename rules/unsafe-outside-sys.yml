# `unsafe` is confined to the single audited raw-process-effect file
# `src/cli_outbound/sys.rs` — the SIGTERM in Stream's drop, and the process
# env fold a §16.7 substrate arm stands in (DESIGN §16.2, bl-81c9). Every
# other `unsafe` block or `unsafe fn` in the tree is an error: reach for safe
# std first, and if an irreducible raw call is genuinely needed, add it to
# sys.rs (rather than extending this rule's `ignores`) so the whole-crate
# unsafe inventory stays auditable at one place.
#
# Node kinds verified against ast-grep 0.44.1's Rust tree-sitter parser:
#   - `unsafe { ... }`        -> node kind `unsafe_block`
#   - `unsafe fn` / modifiers -> node kind `function_modifiers` containing
#                                the `unsafe` keyword (regex `\bunsafe\b`)
id: unsafe-outside-sys
language: rust
severity: error
message: "unsafe is confined to src/cli_outbound/sys.rs (see rules/unsafe-outside-sys.yml)"
ignores:
  - "**/cli_outbound/sys.rs"
rule:
  any:
    - kind: unsafe_block
    - kind: function_modifiers
      regex: '\bunsafe\b'
