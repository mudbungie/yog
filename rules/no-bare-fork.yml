# Every child process is FORKED by `crate::git_env::{spawn, output, status}`,
# never by a bare `Command::spawn/output/status`. `no-bare-command.yml` already
# makes `git_env` build every child; this rule makes it fork every child, and
# the two together are what let the module hold an invariant rather than a
# convention.
#
# `exec` is the fourth verb and the odd one: it forks nothing, it replaces this
# process, and it is here because it too leaves the caller holding a contract
# no caller reliably remembers. `CommandExt::exec` runs std's `do_exec` in THIS
# process, which resets `SIGPIPE` to `SIG_DFL` before `execvp` — so a failed
# exec returns into a live process where the next write down a closed pipe is
# a death and not an error. `crate::git_env::exec` puts it back; a bare one
# does not, and under `cargo test` the corpse is the whole binary, reported as
# `signal: 13, SIGPIPE` with no test failing (bl-3792).
#
# The invariant is now what a child INHERITS: one fork is one place to reason
# about the scrubbed env, the stdio a caller asked for, and the process group a
# detached child lands in. A per-call promise at ~40 sites is not an invariant.
#
# It used to be ETXTBSY as well, and that half has MOVED (bl-fd28). Under
# `cfg(test)` these verbs took one process-wide lock across the fork, on the
# argument that a peer's write fd could not be copied while it was held —
# measured at zero against 8.3% unguarded (bl-6397). The lock only ever covered
# yog's OWN forks, though, and the linked `balls`/`litany`/`brazen` fork `git`
# without it (bl-6bf5: 8 failures from one in-process substrate beat, bl-fd28:
# 2 more from `fan`). So the exposure was removed instead of scheduled around:
# every executable fixture is written by a child (`rules/no-hand-chmod.yml`),
# which leaves no descriptor in this process for ANY fork to copy, and the lock
# — measured at zero on both sides of its own removal — is gone.
#
# Node kinds verified against ast-grep 0.44.1's Rust tree-sitter parser: a
# method call `cmd.spawn()` is a `call_expression` whose `function` field is a
# `field_expression` (text `cmd.spawn`) and whose `arguments` field is `()`.
# Both halves are load-bearing. The `field_expression` requirement excludes
# `std::thread::spawn(…)`, which is a path call and not a fork at all; the
# empty-`arguments` requirement excludes a thread starter that takes one
# (`follow.spawn(repaint)`), and `out.status.success()` never matched because
# the function text ends in `.success`. What that leaves is the ambiguous case,
# a crate type with a zero-argument `spawn` — which is why the three thread
# starters `Poster`/`Asker`/`Searcher` were renamed to `start`: in a crate whose
# one fork lives in `git_env`, `spawn` on anything else is a name asking to be
# misread.
id: no-bare-fork
language: rust
severity: error
message: "spend a Command through crate::git_env::{spawn,output,status,exec} (see rules/no-bare-fork.yml)"
ignores:
  - "**/git_env.rs"
rule:
  kind: call_expression
  all:
    - has:
        field: function
        kind: field_expression
        regex: '\.(spawn|output|status|exec)$'
    - has:
        field: arguments
        regex: '^\(\)$'
