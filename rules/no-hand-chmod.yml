# An executable fixture is written by a CHILD process, never by this one
# (bl-fd28). This rule is the structural half of that: nothing in `src` sets a
# mode bit by hand, so the discipline cannot decay back into a convention the
# next fixture forgets.
#
# The hazard is ETXTBSY, the same one `no-bare-fork.yml` guards from the other
# side. `fs::write` on a fixture script holds a write fd; a `fork` on ANY thread
# copies that fd into a child that keeps it until its own `exec` completes; an
# `exec` of the script inside that window fails. `git_env`'s `cfg(test)` spawn
# lock closes every fork YOG performs — but yog links `balls`, `litany` and
# `brazen`, each of which forks `git` on its own account and takes no lock of
# yog's, so a beat that drives one of them in-process is an unlocked forker for
# as long as it runs (bl-6bf5 measured 8 failures, bl-fd28 another 2 in `fan`).
#
# `git_env`'s module doc used to argue the write side was hopeless — "the
# victim's own care cannot save it" — and that was true of a write-side
# *bracket*, which only works if the peer's fork respects the same lock. It is
# false of a write-side *relocation*: `crate::test_support::write_exec` feeds
# the body to `sh -c 'cat > "$1" && chmod 755 "$1"'`, so the write fd is the
# CHILD's and a peer fork has nothing of this process's to copy. That closes
# every victim at once, whoever forks and in whichever crate.
#
# The matched names are the whole of the `PermissionsExt` write surface:
# `set_permissions` (the act), `from_mode` and `set_mode` (the two ways to build
# the `Permissions` it takes). A mode READ — `metadata(..).permissions().mode()`
# — is untouched, because reading one is not the hazard.
#
# `ignores` is the one location authority, the shape `unsafe-outside-sys.yml`
# uses. Add a site to one of these files rather than widening the list:
#   - `test_support/**` — where `write_exec` lives, plus the two narrow
#     `read_only`/`writable` helpers for the "this file cannot be rewritten"
#     fixture. Neither exposes a mode parameter, so an exec bit is not reachable
#     through them.
#   - `world/tools.rs` — PRODUCTION: §16.7 W9's world shims, the one executable
#     file yog writes for real. It is not a test fixture and there is no `sh` to
#     borrow at that layer.
#   - `wire/provision.rs`, `bz_host/store.rs` — PRODUCTION, and not the exec bit
#     at all: `0600`/`0700` narrowing on key material and the credential store,
#     which `openssl` and the ambient umask would otherwise leave world-readable.
#
# `make rules-audit` scans `src` only, so the integration crate is NOT covered.
# `tests/support/write_exec.rs` is the same helper for those binaries and the
# sweep there is by hand — stated in that file's own module doc.
#
# Node kinds verified against ast-grep 0.44.1's Rust tree-sitter parser: both
# `fs::set_permissions(..)` (a `scoped_identifier` function field) and
# `perms.set_mode(..)` (a `field_expression` one) are `call_expression`s, so the
# rule matches the call and regexes the function text rather than naming a kind.
id: no-hand-chmod
language: rust
severity: error
message: "write executable fixtures with crate::test_support::write_exec — a mode bit set by hand re-opens the ETXTBSY window (see rules/no-hand-chmod.yml)"
ignores:
  - "**/test_support/**"
  - "**/world/tools.rs"
  - "**/wire/provision.rs"
  - "**/bz_host/store.rs"
rule:
  kind: call_expression
  has:
    field: function
    regex: '(^|::|\.)(set_permissions|from_mode|set_mode)$'
