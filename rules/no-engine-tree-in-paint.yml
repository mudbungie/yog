# REMOTE §9.4 (bl-1eb0), mechanized: **paint code names only what the wire can
# carry.** yog's window is to become a pure client of the control boundary
# (REMOTE §1.2) — one method, one channel — so every fact a frame paints must be
# a fact a `Reply` could have told it. `GitTree`, `Agent` and `CommitNode` are
# the engine's *derivation*: fat records read off git and disk on the snapshot
# tick, holding `Stream`s, step commits, tool calls and inbox listings. A thin
# seat will never hold one, so a seat that derives out of one is a surface no
# face but this window can ever paint — which is exactly what step 4 of REMOTE
# §9's build sequence retires.
#
# The line this rule draws is NOT "which module does the type live in". It is
# **is this type reachable from a `Reply`**:
#
#   - `AgentState`, `AgentMark`, `Flight`, `Tone`, `StepCommit`, `Framing` and
#     friends ride the wire today (`boundary/reply/rows.rs` spells their token
#     tables, `boundary/reply/agent.rs` the mark set), so a decoded reply hands
#     one back and naming it here is lawful.
#   - `GitTree` / `Agent` / `CommitNode` ride nothing. Their paint-side answers
#     are `boundary::answer::agent::AgentView` (one conversation as a seat sees
#     it), `nav::convs::{ConvRow, Titles}` (the list, and the §3.3 ladder's
#     id→title input), and `model_pick::ConfigTip` (the config-lineage tip's two
#     strings) — every one of them a payload the codec spells in both
#     directions.
#
# Scoped with `files` to the paint tree: `src/shell/**` (the egui interaction
# glue, coverage-excluded), plus the three view modules that render rather than
# derive — `src/inspector/**`, `src/composer/**`, `src/inboxview/**`. Every
# other module under `src/` is engine: `nav/convs`, `attention`, `delete`,
# `monitor`, `fleet`, `board`, `rail` and `boundary/answer` all legitimately
# fold the agent set, because folding it is what the server does.
#
# `ignores` carves out those trees' own test corpora: a test may build a
# `GitTree` fixture to drive the derivation it is proving, and often must — the
# rule governs what a seat *reads*, not what a harness constructs.
#
# Node kinds verified against ast-grep 0.44.1's Rust tree-sitter parser: in
# `use crate::git_tree::Agent`, in `&[crate::git_tree::Agent]` and in a bare
# `Agent` type position, the name is a `type_identifier` in type position and an
# `identifier` in path/use position — matching both kinds catches every
# spelling. `rules/fixtures/shell/engine_tree.rs` proves it still bites.
#
# **`Query::Agent` and `Reply::Agent` are excepted, and that is the rule's own
# line rather than a hole in it** (bl-48ae). The boundary spells one query per
# conversation-addressed read, and the seventh of that family is named for its
# subject — so a seat declaring it writes the word `Agent` while naming a
# *payload the codec spells in both directions*, which is precisely what this
# rule exists to permit. The carve-out is keyed to the enum path, not to a file:
# an identifier is excepted only when its `scoped_identifier`/
# `scoped_type_identifier` parent's path is `Query` or `Reply`, so
# `crate::git_tree::Agent` — whose path is neither — is still flagged wherever it
# appears, `use` line and type position alike.
id: no-engine-tree-in-paint
language: rust
severity: error
message: "paint code may not name GitTree/Agent/CommitNode — a seat paints only what a Reply could carry (REMOTE §9.4; see rules/no-engine-tree-in-paint.yml)"
files:
  - "**/shell/**"
  - "**/inspector/**"
  - "**/composer/**"
  - "**/inboxview/**"
ignores:
  - "**/tests/**"
  - "**/tests.rs"
  - "**/*tests.rs"
rule:
  all:
    - any:
        - kind: type_identifier
          regex: '^(GitTree|Agent|CommitNode)$'
        - kind: identifier
          regex: '^(GitTree|Agent|CommitNode)$'
    - not:
        inside:
          any:
            - kind: scoped_type_identifier
            - kind: scoped_identifier
          has:
            field: path
            regex: '(^|::)(Query|Reply)$'
