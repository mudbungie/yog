# Bootstrap rule 7: `Mutex`/`RwLock` live only in the crate's lock chokepoint,
# `src/state.rs` (see its module doc). Every other shared-mutable lock in the
# tree is an error — reach for the chokepoint so the whole-crate lock inventory
# stays auditable in one file.
#
# Carve-outs (`ignores`):
#   - Test scaffolding: test-double interior mutability is not app state (a
#     `FakeFs`' path->bytes map, a fake clock's shared instant). This carve-out
#     used to name a `SPAWN_LOCK` beside them; bl-fd28 measured that lock out
#     once every executable fixture was written by a child, so what is left here
#     is interior mutability and nothing that serializes anything. The
#     glob covers the whole `test_support` **subtree** (bl-44e9): the module was
#     one file when this carve-out was written and is a directory now, and a
#     fake clock's shared instant is the same "test-double interior mutability"
#     wherever §12's cap happens to put it. Widening the path is not a new
#     exception — it is the existing one addressed to the module it always
#     named.
#
# There were four code carve-outs beside it — `git_tree/probe_cache.rs`,
# `fs_watcher/hub.rs`, `registry/presence.rs`, `registry/mailbox/slots.rs` —
# each justified by "phantom uncovered regions" a fold into `state.rs` drew.
# Those were measured under tarpaulin's ptrace engine (the only engine that
# ever ran until bl-d147), not llvm; under llvm the folds cover at 100 %, so
# all four locks moved into `state.rs` (bl-0769) and the carve-outs went.
#
# Node kinds verified against ast-grep 0.44.1's Rust tree-sitter parser
# (`--debug-query`): a bare `Mutex`/`RwLock` is a `type_identifier` in type
# position (`Mutex<T>`, a field or return type) and an `identifier` in path or
# `use` position (`Mutex::new`, `use std::sync::Mutex`). Matching both kinds
# catches every spelling; the anchored regex leaves `Arc`/`Atomic*` clear.
id: locks-outside-state
language: rust
severity: error
message: "Mutex/RwLock live only in src/state.rs, the crate lock chokepoint (see rules/locks-outside-state.yml)"
ignores:
  - "**/state.rs"
  - "**/test_support.rs"
  - "**/test_support/**"
  - "**/tests/**"
  - "**/tests.rs"
  - "**/*tests.rs"
rule:
  any:
    - kind: type_identifier
      regex: '^(Mutex|RwLock)$'
    - kind: identifier
      regex: '^(Mutex|RwLock)$'
