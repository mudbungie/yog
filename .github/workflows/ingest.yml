name: Ingest

# AN UPSTREAM RELEASE REACHES `main` WITHOUT A HAND (bl-38dc).
#
# yog links litany and brazen in-process at exact pins. Publishing yog is
# automatic and every endpoint reconciles from the registry, so the two pins
# were the one link a person carried: a litany release reached no device until
# somebody filed a ball and edited two lines. This workflow carries it, hourly
# and on a dispatch:
#
#   1. `make ingest`. It rewrites the litany pin to the registry's newest live
#      litany and the brazen pin to the one THAT litany names, and moves the
#      lockfile. Nothing newer is the same path with an empty diff: done,
#      nothing written anywhere. `scripts/ingest.sh` carries the reasoning.
#   2. `scripts/land-through-gate.sh` — the one definition of how an unattended
#      change reaches `main`, shared with `advisories.yml`, whose header states
#      every choice in it: the two files committed on a branch, `ci.yml`
#      dispatched there and watched, `main` fast-forwarded on a pass, the branch
#      deleted either way. The push to `main` is made with
#      `RELEASE_PLZ_TOKEN`, so it starts the ordinary release chain by
#      itself; nothing here publishes.
#   3. `scripts/alarm.sh` — a red run opens ONE issue that mails the owner,
#      however many hours the streak lasts; the next green run closes it.
#
# WHAT A FAILED RUN MEANS. A red `ci.yml` on the branch means the upstream
# release needs a change in yog — an API it moved, a behaviour a test pins —
# and that IS a hand's: the run fails, `main` is untouched, and it fails again
# every hour (alarming once) until somebody lands the pin move together with
# the code it needs. A refused fast-forward means `main` moved while the gate ran; the
# next hour begins again from the new `main`.
#
# One run at a time: the gate can outlast the hour, and a second run racing
# the first would prove the same move twice and lose the fast-forward.
#
# Every action is pinned to a full commit SHA with its tag in the trailing
# comment (`release-plz.yml`'s discipline): this job writes to `main`.

on:
  schedule:
    - cron: "41 * * * *"
  workflow_dispatch:

# No ambient scopes; the one job states what it writes.
permissions: {}

concurrency:
  group: ingest
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    if: github.repository_owner == 'mudbungie'
    permissions:
      # The branch, its commit and the fast-forward of main.
      contents: write
      # Dispatching ci.yml.
      actions: write
      # scripts/alarm.sh: the one issue a red streak opens.
      issues: write
    env:
      # The landing refuses without it (scripts/land-through-gate.sh): only a
      # push made with this token triggers CI and the release chain on main.
      PAT: ${{ secrets.RELEASE_PLZ_TOKEN }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          token: ${{ secrets.RELEASE_PLZ_TOKEN || github.token }}
          # The whole history: the fast-forward of main is judged by git on
          # THIS clone (advisories.yml states the failure a shallow one buys).
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable branch @ 2026-08-05
        with:
          # The SHA pin erases the ref name this action reads the toolchain
          # from, so name it; rust-toolchain.toml still pins the build version.
          toolchain: stable
      - name: Step the pins
        id: pins
        run: |
          now=$(make -s ingest)
          echo "now=$now" >> "$GITHUB_OUTPUT"
      - name: Land it through the gate
        env:
          # The JOB token, never the release token: GitHub answers a workflow
          # dispatch made with that one 403 (bl-37d8). git's pushes still ride
          # the token checkout seated.
          GH_TOKEN: ${{ github.token }}
          NOW: ${{ steps.pins.outputs.now }}
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "nothing newer: $NOW"
            exit 0
          fi
          scripts/land-through-gate.sh ingest \
            "the pins step to $NOW, ingested from the registry" Cargo.toml Cargo.lock
      # The last two steps of every scheduled job (scripts/alarm.sh): the first
      # red run of a streak opens ONE issue that mails the owner, the next
      # green run closes it.
      - name: Alarm, once per red streak
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/alarm.sh red
      - name: Close the alarm
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/alarm.sh green
