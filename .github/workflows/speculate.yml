# Remote builder for the bl-24e7 speculative merge queue (balls
# docs/design/bl-24e7-speculative-merge-queue.md; adopted for yog in bl-1a5b).
#
# The contract is the verdict store's own file format — no workflow-specific
# protocol exists. scripts/speculate-gate pushes a candidate commit to a
# speculation/<sha> branch; this job runs yog's gate — `scripts/check`, the
# script `make check` is a door onto — records the verdict into the runner's
# local store, and the store dir ships home as an artifact named `verdicts`.
# scripts/speculate-gate downloads and imports it and sweeps the branch; a
# crashed driver leaves the branch behind — sweep by hand: git push origin
# --delete speculation/<sha>. This is the merge-queue builder for a
# public-repo close; the per-commit gate is the noodlezoo builder
# (scripts/pre-commit, bl-1b8d), which runs the same `make check`. Neither
# box builds locally: no verdict is exit 75, and the close waits.
#
# A verdict is keyed by (tree, gate). The gate scripts are tracked, so they
# are already in the tree (balls bl-6a84); the gate half is BALLS_TOOLCHAIN,
# which since balls 0.5.13 the caller of bl-speculate must export itself —
# `rustc -V` here, as scripts/pre-commit exports it on the laptop. A verdict
# recorded here HITS locally only when the runner's toolchain matches yours
# AND your bl-speculate derives the key the way the pinned one installed
# below does: install it from crates.io at the Cargo.toml pin, never from a
# source build (bl-5909). rust-toolchain.toml pins 1.95.0 on both sides —
# bump it in lockstep with a deliberate upgrade, or remote verdicts silently
# stop matching (that is the fingerprint refusing to vouch across toolchains,
# not a bug).
#
# yog is a PUBLIC repo (2026-08-13 publication): standard hosted runners are
# free with no minutes quota. What remains bounded is concurrency and GitHub's
# fair-use backstop (balls design bl-24e7, Remote builders) — merge-queue CI
# for the project itself is squarely the intended use; keep hedge-build volume
# bounded anyway.
name: speculate
on:
  push:
    branches:
      - 'speculation/**'

# The gate reads the candidate tree and ships a verdict home as an artifact; it
# writes nothing to the repo. Actions are pinned to full commit SHAs with their
# tags in the trailing comments — a tag is repointable by its owner between two
# runs, a commit SHA is not (bl-5ae6).
permissions:
  contents: read

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # scripts/speculate-gate does the pushing, from the operator's box.
          # Nothing in this job pushes, so leave no credential behind.
          persist-credentials: false
      # Bare `rustc -V` in the checkout makes rustup resolve and install the
      # rust-toolchain.toml pin — the whole gate fingerprint.
      - name: the gate fingerprint (must match local rustc -V)
        run: rustc -V
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Cache cargo-tarpaulin 0.35.2
        id: tarpaulin-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cargo/bin/cargo-tarpaulin
          key: cargo-tarpaulin-0.35.2-${{ runner.os }}
      - name: Install cargo-tarpaulin 0.35.2
        if: steps.tarpaulin-cache.outputs.cache-hit != 'true'
        run: cargo install cargo-tarpaulin --version 0.35.2 --locked
      - name: Cache cargo-deny 0.20.2
        id: deny-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cargo/bin/cargo-deny
          key: cargo-deny-0.20.2-${{ runner.os }}
      - name: Install cargo-deny 0.20.2
        if: steps.deny-cache.outputs.cache-hit != 'true'
        run: cargo install cargo-deny --version 0.20.2 --locked
      - name: Cache ast-grep 0.44.1
        id: astgrep-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cargo/bin/ast-grep
          key: ast-grep-0.44.1-${{ runner.os }}
      - name: Install ast-grep 0.44.1
        if: steps.astgrep-cache.outputs.cache-hit != 'true'
        run: cargo install ast-grep --version 0.44.1 --locked
      # Cargo.toml is the pin authority (CLAUDE.md rule 6) — the balls version
      # is READ from it, never restated here, so the workflow cannot go stale
      # against the manifest the way a copied version already has once.
      - name: resolve the balls pin from Cargo.toml
        id: balls-pin
        run: echo "version=$(sed -n 's/^balls = "=\(.*\)"$/\1/p' Cargo.toml)" >> "$GITHUB_OUTPUT"
      - name: Cache bl-speculate (balls, pinned by Cargo.toml)
        id: speculate-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cargo/bin/bl-speculate
          key: bl-speculate-${{ steps.balls-pin.outputs.version }}-${{ runner.os }}
      - name: Install bl-speculate (balls, pinned by Cargo.toml)
        if: steps.speculate-cache.outputs.cache-hit != 'true'
        run: cargo install balls --version "${{ steps.balls-pin.outputs.version }}" --locked --bin bl-speculate
      # A verdict is recorded ONLY when the gate reached a conclusion about
      # the tree, and the gate's exit code is what says so (bl-673a). 75 is
      # scripts/check-coverage.sh reporting that this runner signaled tarpaulin
      # on both attempts: an infrastructure death, five times sighted, once with
      # the macOS leg of the same tree green. It is not a verdict, and recording
      # it as one is permanent — a verdict is keyed by (tree, gate), a stored
      # FAIL makes balls' `speculate_run` stop the candidate chain there on
      # every later pass WITHOUT rebuilding, and no re-run can dislodge it
      # because the tree is unchanged. A run that is killed outright writes no
      # output here at all, which lands in the same safe place: no verdict.
      # `scripts/check`, not `make check`: make reports a recipe's 75 as its
      # own exit 2, and the distinction this step exists for would be gone.
      - name: run the gate (scripts/check — three exit words)
        id: gate
        run: |
          set +e
          scripts/check
          code=$?
          if [ "$code" -eq 0 ]; then
            echo "verdict=pass" >>"$GITHUB_OUTPUT"
          elif [ "$code" -eq 75 ]; then
            echo "the gate produced NO verdict about this tree: it was killed" >&2
            echo "from outside (bl-673a). Nothing is recorded; the driver" >&2
            echo "rebuilds rather than reading a failure into this." >&2
          else
            echo "verdict=fail" >>"$GITHUB_OUTPUT"
          fi
          exit "$code"
      # The gate does not record (it is the same script every builder runs);
      # the builder does, under the key the laptop will ask for: the tree and
      # this runner's `rustc -V`, which the rust-toolchain.toml pin makes the
      # laptop's own.
      - name: record the verdict (BALLS_TOOLCHAIN is the gate half of the key)
        if: always() && (steps.gate.outputs.verdict == 'pass' || steps.gate.outputs.verdict == 'fail')
        env:
          VERDICT: ${{ steps.gate.outputs.verdict }}
        run: BALLS_IDENTITY=github-actions BALLS_TOOLCHAIN="$(rustc -V)" bl-speculate record "$VERDICT"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: verdicts
          path: ~/.local/state/balls/plugins/bl-speculate/verdicts/
