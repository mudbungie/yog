name: Release-plz

# Build-gated, hands-off release. Five jobs:
#
#   * release-plz PR (every push to main) — opens/updates ONE "release PR" that
#     bumps the version in Cargo.toml and stages the CHANGELOG.md entry for it.
#     It never publishes; it just keeps the next release queued. Merging that PR
#     is the human control point.
#   * release (when the CI workflow concludes `success` on main) — releases any
#     version on main that is not out yet: tags it `v<version>`, cuts a GitHub
#     Release and publishes it to crates.io. Gated on `workflow_run` of CI, so a
#     release only ever ships a GREEN build — never an untested commit.
#   * release-binaries — builds the `yog` binary and attaches its linux-gnu archive to that
#     Release. It runs in the SAME workflow run and `needs:` the release job,
#     NOT as a separate `on: release` workflow — a Release created by the
#     default GITHUB_TOKEN cannot trigger another workflow (GitHub's
#     anti-recursion rule), so a separate binaries workflow would silently never
#     fire without a PAT. `workflow_dispatch` with `binaries_tag` backfills an
#     existing tag — and reaches ONLY this job (see the boundary below). Which
#     tag it builds arrives as DATA from the release job's `tag` output (or
#     from that dispatch input), and the job refuses when the tag disagrees
#     with the checked-out `Cargo.toml` version — never `git describe`, which
#     raced the tag it was released for on 0.0.6 and uploaded the previous
#     version's archive over the previous release (bl-159d).
#   * release-image — builds the OCI image with `make image` (so the image-side
#     disclosure gate runs ON THE RUNNER, over the bytes about to leave it) and
#     pushes ONE immutable version tag to `ghcr.io/<this repo>`. Same `needs:`
#     shape and the same tag-vs-manifest refusal as the binaries job, and one
#     door fewer: no dispatch backfill, because a Release asset can be replaced
#     and a registry tag cannot. DESIGN §10.1 is the ruling it performs; the
#     box-side reconciler (`scripts/deploy/reconcile.sh`) is what consumes it.
#   * prune-stale-branches (right after the release PR job) — deletes every
#     branch that has no open PR, keeping only `main`, `balls/tasks` and any
#     live `speculation/**`. release-plz pushes a NEW timestamped branch each
#     time it refreshes the release PR, and it pushes that branch BEFORE opening
#     the PR, so superseded and orphaned branches otherwise pile up one per push
#     to main. The repo's "Automatically delete head branches" setting only
#     fires on MERGE and never sees them. Running immediately after the PR job
#     means the current release PR is already open, which makes "has no open PR"
#     an exact test for "superseded or orphaned" — and, since CI runs on
#     `pull_request` and not on branch pushes, the same test is exact for an
#     agent's abandoned probe branch (bl-1ea9).
#
# So the flow is: merge work to main -> CI runs -> the release PR is kept fresh;
# merge the release PR -> CI runs -> on green the new version is released AND
# its binaries build and upload AND its image publishes to ghcr. The crate, the
# archive and the image are one publication carrying one version, which is why
# all three hang off the one release job's outputs rather than off three
# triggers that could disagree.
#
# Bumps default to PATCH (0.0.1 -> 0.0.2). See release-plz.toml for the
# `[minor]` / `[major]` opt-in markers.
#
# ---------------------------------------------------------------------------
# The publishing boundary (bl-5ae6). The publish credential is the crown jewel
# here: it can push arbitrary code to crates.io under this crate's name. Eight
# rules hold it in, each one a line you can point at:
#
#   1. Only the release job sees CARGO_REGISTRY_TOKEN. The PR job opens a pull
#      request and publishes nothing, so it is handed no registry authority.
#   2. The release job declares `environment: publish`, so the token can live as
#      an ENVIRONMENT secret with reviewers/branch rules attached rather than as
#      a repo-wide secret every job could request. See "One-time repo setup".
#   3. Every third-party action is pinned to a full commit SHA, with its tag in
#      a trailing comment. A tag is mutable — the owner can repoint `v0.5` at
#      new code between two runs; a commit SHA cannot be repointed.
#   4. `permissions: {}` at the top means every job starts with NO token scopes
#      and states its own. A job that only reads gets no write.
#   5. The release job publishes the EXACT commit CI tested
#      (`workflow_run.head_sha`), not whatever the branch points at now. Without
#      this, code B can ship on code A's green build.
#   6. A manual dispatch can no longer enter the release job at all — publishing
#      requires a green CI verdict, full stop. Dispatch backfills binaries only.
#   7. The dispatch input crosses into shell through an `env:` variable, never
#      by `${{ }}` interpolation into a run block (that substitution happens
#      before bash parses the line, so a crafted value would be executed as
#      script, not read as data).
#   8. Checkout does not persist its credentials into `.git/config` for the
#      binaries job, which pushes nothing. Where a job DOES push (release-plz's
#      branch and tag pushes, the prune job's deletes), persistence stays on and
#      is annotated at the step.
#
# GitHub's guidance behind those rules:
#   https://docs.github.com/en/actions/reference/security/secure-use
#   https://docs.github.com/en/actions/concepts/security/script-injections
# ---------------------------------------------------------------------------
#
# One-time repo setup:
#   * Settings -> Actions -> General -> Workflow permissions: enable "Allow
#     GitHub Actions to create and approve pull requests" — else the release-pr
#     job 403s ("GitHub Actions is not permitted to create or approve pull
#     requests").
#   * Same page: set Workflow permissions to "Read and write permissions"
#     (default_workflow_permissions: write). Seen live on the 0.0.3 release
#     (bl-1e88): with the fresh repo's read-only default, the release job
#     published to crates.io and then 403'd creating refs/tags/v0.0.3
#     ("Resource not accessible by integration") — despite this workflow's own
#     job-level `permissions: contents: write` — so the tag was hand-pushed
#     and no GitHub Release object was cut. cargo publish is irreversible, so
#     this setting must be verified BEFORE merging a release PR, not after.
#   * An Actions ENVIRONMENT named `publish` (Settings -> Environments) holding
#     CARGO_REGISTRY_TOKEN — a crates.io API token with publish scope, owned by
#     the crate owner. REQUIRED for the release job to publish. Restrict its
#     deployment branches to `main` and add a required reviewer if you want the
#     publish to pause for a human. A repo-level secret of the same name still
#     resolves for this job, so the workflow works before the move; moving it is
#     what makes rule 2 real.
#   * ONCE, AFTER THE FIRST RELEASE PUBLISHES AN IMAGE: flip the ghcr package
#     to PUBLIC. GitHub creates a new package private whatever the repository's
#     visibility, and every deployed box reads the registry anonymously by
#     design (it holds no registry credential — DESIGN §10.1), so until the
#     flip each box's reconcile pass refuses instead of upgrading. There is no
#     REST route for it; the act is the package's own settings page:
#     Packages -> yog -> Package settings -> Danger Zone -> Change visibility.
#   * RELEASE_PLZ_TOKEN — OPTIONAL fine-grained PAT (contents + pull-requests
#     write), so the release PR's own commits re-trigger CI. The default
#     GITHUB_TOKEN cannot trigger workflows from its own pushes; the job falls
#     back to it when RELEASE_PLZ_TOKEN is unset.

on:
  push:
    branches: [main]
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      binaries_tag:
        description: "Build + upload binaries for this EXISTING tag (e.g. v0.0.1). Backfill only — a dispatch never publishes."
        required: true

# No ambient scopes. Every job below states the token scopes it needs.
permissions: {}

jobs:
  release-plz-pr:
    name: release-plz PR
    runs-on: ubuntu-latest
    # Only a direct push to main maintains the release PR (not the CI
    # workflow_run). Owner guard: never runs in a fork. Safe against fork-PR
    # abuse because none of this workflow's triggers are reachable from a fork
    # PR — a fork PR fires `pull_request` (not requested here), never
    # `push`-to-main / `workflow_run` / `workflow_dispatch`, all of which need
    # write access to upstream.
    if: github.repository_owner == 'mudbungie' && github.event_name == 'push'
    # Opens/updates a PR and pushes its branch; it never publishes, so it is
    # handed no registry token (boundary rule 1).
    permissions:
      contents: write
      pull-requests: write
    # Never run two release-PR updates at once — they would race on the branch.
    concurrency:
      group: release-plz-pr-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          # Credentials stay in .git/config on purpose: release-plz pushes the
          # timestamped release-plz-* branch with plain `git push`, which reads
          # the auth header checkout leaves behind.
          persist-credentials: true
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable branch @ 2026-08-05
        with:
          # The SHA pin erases the ref name this action normally reads the
          # toolchain from, so name it. rust-toolchain.toml still pins the
          # version actually used to build.
          toolchain: stable
      - name: Run release-plz
        uses: release-plz/action@2eb1d8bcb770b4c48ccfaad919734b38b51958c9 # v0.5.131
        with:
          command: release-pr
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_PLZ_TOKEN || secrets.GITHUB_TOKEN }}

  release-plz-release:
    name: release-plz release
    runs-on: ubuntu-latest
    # Release only on a GREEN build: a CI run that concluded `success` on main.
    # There is no manual door into this job (boundary rule 6) — a dispatch with
    # no CI verdict must not be able to publish, and `workflow_run` is the only
    # trigger that carries the tested SHA rule 5 needs.
    if: >-
      github.repository_owner == 'mudbungie' &&
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.conclusion == 'success'
    # The one job with publish authority. `environment:` is what lets
    # CARGO_REGISTRY_TOKEN be an environment secret behind branch/reviewer rules
    # instead of a repo-wide one (boundary rule 2).
    environment: publish
    permissions:
      contents: write
    concurrency:
      group: release-plz-release
      cancel-in-progress: false
    # Tell the binaries job whether a release actually happened, and WHICH tag
    # it cut. The tag must be handed off as DATA, not re-derived downstream:
    # this job tags a commit the binaries job's own checkout may not have
    # fetched yet, so an ancestor walk (`git describe`) from there answers with
    # whatever tag it happens to see — the 0.0.6 race (bl-159d).
    outputs:
      releases_created: ${{ steps.release.outputs.releases_created }}
      tag: ${{ steps.released.outputs.tag }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          # Check out the BRANCH, not a bare SHA: release-plz runs `git rev-parse
          # @{upstream}` to find the current branch, which fails on a detached
          # HEAD. The next step then moves that branch back to the exact commit
          # CI tested, so HEAD stays attached AND the tree is the tested one.
          ref: ${{ github.event.workflow_run.head_branch }}
          # release-plz pushes the v<version> tag with plain `git push`.
          persist-credentials: true
      - name: Publish only the commit CI proved green
        # main may have moved between CI going green and this job starting.
        # Releasing the branch tip would ship code B on code A's verdict, so
        # rewind to workflow_run.head_sha — the exact commit that passed
        # (boundary rule 5). The SHA is on this branch's history and fetch-depth
        # 0 fetched all of it, so this cannot silently pick up something else.
        env:
          TESTED_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          git reset --hard "$TESTED_SHA"
          git --no-pager log -1 --format='releasing %H %s'
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable branch @ 2026-08-05
        with:
          toolchain: stable
      - name: Run release-plz
        id: release
        uses: release-plz/action@2eb1d8bcb770b4c48ccfaad919734b38b51958c9 # v0.5.131
        with:
          command: release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
      - name: Extract the released tag
        # `releases` is the action's own JSON record of what it just released,
        # e.g. [{"package_name":"yog","prs":[],"tag":"v0.0.7","version":"0.0.7"}].
        # One crate releases here, so `.[0].tag` is it. Read via env, so the
        # JSON never reaches the shell as code (boundary rule 7).
        id: released
        if: steps.release.outputs.releases_created == 'true'
        env:
          RELEASES: ${{ steps.release.outputs.releases }}
        run: |
          set -euo pipefail
          printf 'tag=%s\n' "$(jq -r '.[0].tag' <<<"$RELEASES")" >> "$GITHUB_OUTPUT"

  release-binaries:
    name: yog x86_64-unknown-linux-gnu
    needs: release-plz-release
    # Two ways in, and neither one can publish:
    #   * a release the job above just cut, or
    #   * a manual backfill for an existing tag.
    # `!cancelled()` is required for the backfill: a `needs:` job that was
    # SKIPPED (the release job on a dispatch) skips its dependents unless the
    # condition calls a status function. The owner guard rides along because a
    # fork can reach neither trigger.
    if: >-
      !cancelled() && github.repository_owner == 'mudbungie' &&
      (needs.release-plz-release.outputs.releases_created == 'true' ||
       (github.event_name == 'workflow_dispatch' && github.event.inputs.binaries_tag != ''))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          # This job pushes nothing — it uploads through the API with an
          # explicit token — so checkout leaves no credential in .git/config
          # for a build script to find (boundary rule 8).
          persist-credentials: false
      - name: Resolve + check out the release tag
        id: tag
        shell: bash
        # The dispatch input arrives as DATA in the environment, never as
        # `${{ }}` text spliced into this script (boundary rule 7).
        env:
          BINARIES_TAG: ${{ github.event.inputs.binaries_tag }}
          RELEASED_TAG: ${{ needs.release-plz-release.outputs.tag }}
        run: |
          set -euo pipefail
          # The manual backfill input wins; otherwise the tag the release job
          # just cut, handed over as its output. NEVER `git describe` — that
          # asks this checkout what it can see, and this checkout is fetched
          # concurrently with the tag being pushed. On the 0.0.6 release it
          # answered `v0.0.5` seconds after v0.0.6 was tagged, so the job built
          # the previous version and uploaded it OVER the previous release's own
          # asset, while the new release got nothing (bl-159d).
          tag="${BINARIES_TAG:-$RELEASED_TAG}"
          if [ -z "$tag" ]; then
            echo "no tag to build: neither binaries_tag nor the release job's tag output is set" >&2
            exit 1
          fi
          # Must name a real tag: that pins the checkout below to a tag object
          # rather than a same-named branch or a path, whatever was typed.
          git rev-parse -q --verify "refs/tags/$tag" >/dev/null
          printf 'tag=%s\n' "$tag" >> "$GITHUB_OUTPUT"
          # Build the tagged (released) code, not whatever main's tip is now.
          git checkout "refs/tags/$tag"
          # And refuse outright if the tree we just checked out is not the
          # version the tag names. This is what turns the whole class from
          # "uploaded the wrong thing, silently" into "said no": the tag and
          # the manifest are two independent statements of one fact, and an
          # asset is only ever published when they agree. The `sed` range
          # restricts to `[package]`, so a dependency's `version =` cannot be
          # read as the crate's.
          manifest="$(sed -n '/^\[package\]/,/^\[/p' Cargo.toml |
                      sed -n 's/^version *= *"\([^"]*\)".*/\1/p' | head -1)"
          if [ "$tag" != "v$manifest" ]; then
            echo "tag $tag does not name the checked-out crate version $manifest — refusing to upload" >&2
            exit 1
          fi
          echo "building $tag (Cargo.toml says $manifest)"
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable branch @ 2026-08-05
        with:
          toolchain: stable
      # Builds `cargo build --release`, archives the binaries as
      # yog-x86_64-unknown-linux-gnu.tar.gz and uploads it to the Release
      # for the resolved tag. Uploading assets with GITHUB_TOKEN is fine — only
      # *triggering a new workflow* from a token-made event is what GitHub blocks.
      - name: Build and upload yog
        uses: taiki-e/upload-rust-binary-action@f0d45ae91ee7b8ee928de7a9d04d893a08bcbec6 # v1.30.2
        with:
          bin: yog
          target: x86_64-unknown-linux-gnu
          archive: yog-$target
          ref: refs/tags/${{ steps.tag.outputs.tag }}
          token: ${{ secrets.GITHUB_TOKEN }}

  release-image:
    name: ghcr image
    needs: release-plz-release
    # ONE door, and it is a release that actually happened — the same output
    # that says a crate version went out. There is deliberately no dispatch
    # backfill beside the binaries job's: an uploaded asset can be replaced,
    # and a published registry tag cannot (DESIGN §10.1, "a version is
    # published once" — re-pushing corrected bytes under an existing tag is a
    # moving `latest` wearing a version number). A version that missed its
    # image is superseded by the next version, exactly as a bad crate release
    # is. No `!cancelled()` either, for the same reason: this job has no
    # skipped-`needs` path to rescue.
    if: >-
      github.repository_owner == 'mudbungie' &&
      needs.release-plz-release.outputs.releases_created == 'true'
    runs-on: ubuntu-latest
    # The build compiles the crate from source inside `rust:1.95.0-alpine` and
    # the gate then exports two root filesystems and compares them file by
    # file. Neither is fast; both are bounded.
    timeout-minutes: 60
    permissions:
      # This is the whole of the publishing authority DESIGN §10.1 rules for
      # images: `packages: write` on the repository's OWN package, held by the
      # workflow's GITHUB_TOKEN, which exists only inside this run. No PAT, no
      # registry secret, nothing to rotate, and "who may publish an image" is
      # answered by the same access control that answers "who may push a tag".
      # `contents: read` is the checkout and nothing else — this job pushes no
      # ref, cuts no release and is handed no crates.io token (boundary
      # rules 1 and 4).
      contents: read
      packages: write
    env:
      # Derived, never typed. §10.1 is "one package per repo, named for the
      # component", so the repository IS the package; a literal here would be
      # that fact stored twice, and the box-side reconciler already states it
      # once for the box.
      PACKAGE: ghcr.io/${{ github.repository }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          # This job pushes no git ref — the registry push authenticates on its
          # own — so checkout leaves no credential in `.git/config` for a build
          # step to find (boundary rule 8). It matters more here than anywhere:
          # the build hands a whole context to a container engine.
          persist-credentials: false
      - name: Check out the released tag, and refuse a tree that disagrees with it
        id: tag
        env:
          RELEASED_TAG: ${{ needs.release-plz-release.outputs.tag }}
        run: |
          set -euo pipefail
          tag="$RELEASED_TAG"
          [ -n "$tag" ] || { echo "the release job cut no tag — nothing to publish" >&2; exit 1; }
          # Named outright, never `git describe`: that asks this checkout what
          # it happens to see while the tag is being pushed, and on 0.0.6 it
          # answered with the previous version (bl-159d).
          git rev-parse -q --verify "refs/tags/$tag" >/dev/null
          git checkout "refs/tags/$tag"
          # `make` reads the version out of Cargo.toml — its one home — and
          # prints the local tag `make image` is about to build.
          local_tag="$(make -s print-image-tag)"
          version="${local_tag##*:}"
          # The tag and the manifest are two independent statements of one
          # fact, and an artifact publishes only when they agree.
          if [ "$tag" != "v$version" ]; then
            echo "tag $tag does not name the checked-out crate version $version — refusing to publish an image" >&2
            exit 1
          fi
          printf 'local=%s\n' "$local_tag" >> "$GITHUB_OUTPUT"
          printf 'version=%s\n' "$version" >> "$GITHUB_OUTPUT"
          echo "publishing $tag as $PACKAGE:$version"
      - name: A version publishes once — stop if this one already did
        id: existing
        env:
          VERSION: ${{ steps.tag.outputs.version }}
          REPOSITORY: ${{ github.repository }}
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # The trigger above already makes this rare — release-plz reports a
          # release once per version — but a re-run of a job whose `needs`
          # outputs are replayed would arrive here a second time, and a rebuild
          # is not byte-identical, so a second push would move the tag onto new
          # bytes. That is the one thing §10.1 forbids outright.
          #
          # ghcr's OAuth dance: exchange the workflow token for a pull-scoped
          # bearer, then ask for the manifest. Measured against this package
          # before it existed: WITH credentials the token exchange answers 200
          # and both `tags/list` and `manifests/<v>` answer 404, while an
          # ANONYMOUS exchange for a package that is absent (or private) is
          # refused 403 with no token at all — which is why this reads with the
          # workflow token, and why the box-side reconciler, which holds no
          # credential, needs the package to be public.
          bearer="$(curl -sS -u "x:$REGISTRY_TOKEN" \
            "https://ghcr.io/token?service=ghcr.io&scope=repository:$REPOSITORY:pull" |
            sed -n 's/.*"token":"\([^"]*\)".*/\1/p')"
          [ -n "$bearer" ] || { echo "ghcr issued no pull token for $REPOSITORY" >&2; exit 1; }
          code="$(curl -sS -o /dev/null -w '%{http_code}' \
            -H "Authorization: Bearer $bearer" \
            -H 'Accept: application/vnd.oci.image.manifest.v1+json' \
            -H 'Accept: application/vnd.docker.distribution.manifest.v2+json' \
            "https://ghcr.io/v2/$REPOSITORY/manifests/$VERSION")"
          case "$code" in
            404) printf 'push=yes\n' >> "$GITHUB_OUTPUT"
                 echo "$PACKAGE has no $VERSION — publishing it" ;;
            200) printf 'push=no\n' >> "$GITHUB_OUTPUT"
                 echo "$PACKAGE:$VERSION is already published — not re-pushing" ;;
            # Anything else is a question this job must not answer by guessing:
            # the guess that costs something is the one that pushes.
            *)   echo "ghcr answered $code for $PACKAGE:$VERSION — refusing to publish on an unread registry" >&2
                 exit 1 ;;
          esac
      - name: Build the image, gate included
        if: steps.existing.outputs.push == 'yes'
        # `make image` ends in `make image-scan` (DESIGN §10.1's condition on
        # the registry ruling), so the disclosure gate runs here, on this
        # runner, over the exact image the next step pushes — build, scan, then
        # push, in one job, or the gate is a different image's. It also tags
        # `yog:latest` LOCALLY; that tag dies with the runner and is never
        # pushed.
        #
        # ENGINE IS STATED, AND IT IS PODMAN — measured, not preferred. A
        # runner carries both engines, and under docker the gate's THIRD
        # SURFACE (the image config) silently reads as empty: `docker image
        # inspect` has no top-level `History`, so `image-scan.sh`'s one
        # `--format` template fails execution, writes a single newline and
        # exits non-zero, which is enough to satisfy an emptiness check and
        # leaves every `Env` unscanned. The self-test catches it and the build
        # is refused rather than published — the gate fails closed — but a
        # refused build publishes nothing at all. Proven on a runner: podman
        # builds this image, catches all five planted findings and scans the
        # real image clean. The docker gap is bl-09d4; when it closes,
        # this becomes a one-word change. Autodetect would pick podman here
        # anyway; naming it means a runner image that drops podman fails loudly
        # instead of silently changing what gates a published artifact.
        # `.dockerignore` is a symlink to `.containerignore` so the build
        # context is one list under either engine.
        #
        # SINGLE-ARCH, x86_64, and stated rather than implied: the runner is
        # amd64 and the image carries one static musl binary built for it. An
        # arm64 box gets nothing it can run. A multi-arch manifest is a real
        # cost (emulated or cross builds, and a gate run per architecture) and
        # would be its own decision, not a flag added here.
        run: |
          set -euo pipefail
          command -v podman >/dev/null || {
            echo "this runner has no podman, and the image gate's config surface does not survive docker — refusing to publish an ungated image" >&2
            exit 1
          }
          make image ENGINE=podman
      - name: Log in to ghcr as this run
        if: steps.existing.outputs.push == 'yes'
        env:
          # Both arrive as DATA in the environment rather than as `${{ }}`
          # spliced into the script (boundary rule 7).
          ACTOR: ${{ github.actor }}
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: printf '%s' "$REGISTRY_TOKEN" | podman login ghcr.io -u "$ACTOR" --password-stdin
      - name: Push the version tag, and record the digest
        if: steps.existing.outputs.push == 'yes'
        env:
          LOCAL_TAG: ${{ steps.tag.outputs.local }}
          VERSION: ${{ steps.tag.outputs.version }}
        run: |
          set -euo pipefail
          remote="$PACKAGE:$VERSION"
          podman tag "$LOCAL_TAG" "$remote"
          # The digest is the other immutable name §10.1 publishes, and it is
          # only knowable after the push — so it is read from the push itself
          # rather than asked of the engine afterwards, which would answer
          # about a local record of a remote fact.
          podman push --digestfile digest.txt "$remote"
          digest="$(cat digest.txt)"
          [ -n "$digest" ] || { echo "pushed $remote but the push reported no digest" >&2; exit 1; }
          echo "published $remote@$digest"
          {
            echo "### Image published"
            echo
            echo "- tag: \`$remote\`"
            echo "- digest: \`$digest\`"
          } >> "$GITHUB_STEP_SUMMARY"

  prune-stale-branches:
    name: prune stale branches
    # `needs` with no `if` means: only after the release-PR job actually ran and
    # succeeded. On the workflow_run/dispatch triggers that job is skipped, so
    # this one is too — pruning only ever follows a PR refresh.
    needs: release-plz-pr
    # release-plz pushes a NEW timestamped `release-plz-*` branch every time it
    # refreshes the release PR and leaves the previous one behind. Worse, it
    # pushes the branch BEFORE opening the PR, so if PR creation fails (as it
    # did across brazen before "Allow GitHub Actions to create and approve pull
    # requests" was enabled — 24 orphaned branches, zero PRs) the branch is
    # stranded with no PR to ever close or merge. Unattended, that is one dead
    # branch per push to main.
    #
    # The repo's "Automatically delete head branches" setting only fires on
    # MERGE, which covers the happy path and nothing else. This job covers the
    # rest: it runs immediately after the PR job, so the branch backing the
    # CURRENT release PR is already open, and "has no open PR" is therefore an
    # exact test for "superseded or orphaned". No allowlist, no age heuristic,
    # no state to keep — the open-PR set is the single source of truth.
    #
    # IT SWEEPS EVERY BRANCH, NOT JUST THE RELEASE ONES (bl-1ea9). The test above
    # is exact for anything an agent pushes, for a reason that lives in ci.yml:
    # CI triggers on `push: branches: [main]` and on `pull_request`, and NOT on
    # a push to any other branch. A branch is therefore pushed here for exactly
    # one purpose — to buy a runner verdict — and a verdict requires a PR. A
    # branch with no open PR cannot be a live probe; it is debris by
    # construction. AGENTS.md "Repo discipline" states the model this enforces.
    #
    # A false delete is cheap and that is why no age floor is needed: the work
    # lives in the agent's claim worktree and lands by `bl close`, never off a
    # branch, so the worst case is one re-push.
    #
    # Two exclusions, both load-bearing:
    #   * `main` and `balls/tasks` are the durable refs — the trunk and the
    #     balls task store. Neither ever has a PR.
    #   * `speculation/**` is the ONE branch kind that is live without a PR:
    #     speculate.yml triggers on `push: branches: 'speculation/**'`, so a
    #     running gate has a branch and no pull request, and sweeping it would
    #     kill the build it is waiting on. scripts/speculate-gate deletes its
    #     own on every trappable path; a SIGKILL leaks one, and that is the
    #     residual this job deliberately does not collect.
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # Deleting a remote branch is a push: the credential has to stay.
          persist-credentials: true
      - name: Delete every branch with no open PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -uo pipefail
          open="$(gh pr list --state open --json headRefName -q '.[].headRefName')"
          git ls-remote --heads origin |
            awk '{print $2}' | sed 's#refs/heads/##' |
            while read -r branch; do
              case "$branch" in
                main|balls/tasks)  echo "keep    $branch (durable)";        continue ;;
                speculation/*)     echo "keep    $branch (gate may be live)"; continue ;;
              esac
              if grep -qxF "$branch" <<<"$open"; then
                echo "keep    $branch (backs an open PR)"
              else
                echo "delete  $branch"
                git push origin --delete "$branch"
              fi
            done
