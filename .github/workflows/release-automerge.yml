name: Auto-merge release PR

# Merging the release PR used to be the human control point. It is not one
# (bl-1c05, operator ruling 2026-09-03): the decision it asked for was already
# made by the work that landed on main, and the publish is gated AFTER the
# merge — `release-plz.yml`'s release job runs on a CI `workflow_run` that
# concluded `success`, so a red build skips the publish and the bump merely
# sits on main. Holding the PR open bought nothing and cost every release a
# hand.
#
# This workflow merges it. What follows is the derivation, because yog's
# topology is NOT the one its twin in `lernie` has (bl-4e56) and copying that
# mechanism here would produce something that merges nothing.
#
# ---------------------------------------------------------------------------
# THE TOKEN IS THE WHOLE MECHANISM
#
# `release-plz.yml` takes an OPTIONAL fine-grained PAT, RELEASE_PLZ_TOKEN, and
# this repository has one. That single fact produces both halves of what is
# needed here, and it is why nothing else is needed:
#
#   * BEFORE the merge — the release PR carries checks. GitHub does not run
#     `pull_request` workflows for a pull request opened by the default
#     GITHUB_TOKEN, so in a repository WITHOUT the PAT the release PR has no CI
#     run at all and there is nothing to wait on. Here it has both `CI` and
#     `macOS`, observed live on every release PR.
#   * AFTER the merge — the merge is a push to main by a user token, so CI runs
#     on main, and its completion is what fires `release-plz.yml`'s
#     `workflow_run` release job. Merging with GITHUB_TOKEN instead would land
#     the bump and trigger NOTHING (GitHub, verbatim: "with the exception of
#     `workflow_dispatch` and `repository_dispatch`, other GITHUB_TOKEN
#     triggered events do not create workflow runs"), leaving the version
#     bumped on main and unpublished until some unrelated push happened by.
#
# So this workflow merges with RELEASE_PLZ_TOKEN and never with GITHUB_TOKEN,
# and it needs NO post-merge dispatch — which is the one place it differs
# sharply from lernie, where the merge must dispatch the release workflow by
# hand because there is no PAT and therefore no retrigger.
#
# The two halves are the same property, and that is what makes the design
# hold together rather than depend on an assumption: waiting on a green CI run
# IS the proof that the merging token can trigger workflows. A token that
# cannot (GITHUB_TOKEN, or a GitHub App installation token swapped in) produces
# no CI run on the pull request, so the green gate below is never satisfied and
# this workflow merges nothing. It cannot merge into a dead chain — the
# condition it waits on is the condition it depends on. Hence no dispatch, no
# post-merge assertion, and no second door into the release path (which would
# also breach `release-plz.yml`'s boundary rule 6: publishing requires a green
# CI verdict, full stop).
#
# With no PAT, this workflow merges nothing and says so on every run. That is
# correct rather than degraded: without the PAT there would be no checks to
# wait on and no trigger after the merge, so the honest answer is to leave the
# PR for a hand.
#
# ---------------------------------------------------------------------------
# WHAT "GREEN" MEANS HERE, AND WHY IT IS NOT THE CHECK ROLLUP
#
# The gate is the `CI` workflow's own conclusion on the pull request's head
# commit — not the pull request's aggregate check state. `macOS` runs on the
# same triggers and is deliberately NOT what a publish waits on (bl-0158: a
# `workflow_run` verdict belongs to the run, not to a job, so macOS was moved
# out of `ci.yml` rather than be allowed to hold every release). Gating this
# merge on the rollup would put it straight back into the release path through
# the side door — a red macOS would hold the release PR forever. This asks the
# same question `release-plz.yml` asks, of the same workflow, so the merge gate
# and the publish gate cannot disagree.
#
# `mergeStateStatus` is printed for diagnosis and NOT gated on, for the same
# reason: a reported-but-not-gating macOS leaves it `UNSTABLE`.
#
# ---------------------------------------------------------------------------
# THE GUARDS
#
# lernie's author guard — "author is `app/github-actions` with `is_bot`" —
# matches NOTHING here and must not be copied: because the PAT opens them,
# yog's release PRs are authored by the repository owner, a human account
# indistinguishable by author from any other pull request they open. Four
# guards stand instead, and the third is the one carrying the weight the author
# guard carries elsewhere:
#
#   1. The head branch is release-plz's own timestamped shape, anchored end to
#      end — `release-plz-YYYY-MM-DDTHH-MM-SSZ`. Checked against every release
#      pull request this repository has had; a branch merely STARTING with the
#      prefix does not pass.
#   2. The author is the repository owner (the PAT's identity) or the Actions
#      bot (the GITHUB_TOKEN fallback's). Both are lawful authors of a release
#      PR and no third party is.
#   3. Every changed file is one of `Cargo.toml`, `Cargo.lock`, `CHANGELOG.md`,
#      and there is at least one. This is what a release PR IS — a version bump
#      and its changelog entry — and it is a structural test no human pull
#      request passes by accident, whoever opened it and whatever the branch is
#      called.
#   4. Not a draft, and GitHub says `MERGEABLE`.
#
# A verdict line is printed for EVERY open pull request on EVERY run, passing
# or not: a mechanism that merges silently is one nobody can audit, and the run
# log is the only record this workflow keeps. The ONE thing it writes into a
# pull request is the protocol-gate hold below, and that exception is argued
# where the gate is: a release parked for days by a check nobody can see from
# the pull request is a mechanism that looks broken. Nothing else reaches a
# body or a comment — a body cannot be un-published, and this repository bans
# session artifacts from published text outright, so the held comment names
# repositories and integers and nothing else.
#
# ---------------------------------------------------------------------------
# THE PROTOCOL GATE — A BUMP DOES NOT PUBLISH AHEAD OF ITS CONSUMERS (bl-bca2)
#
# yog is the only component that mints the wire protocol version. The seat
# (`lernie`), the foot (`thrall`) and the phone (`yog-android`) each VENDOR a
# copy of the constant, and the wire is fail-closed on a mismatch with no
# negotiation (`docs/REMOTE.md` §3). So a yog release that raised PROTOCOL
# published a suite that could not compose until three other repositories
# caught up — measured on 2026-09-06 as engine 15, foot 14, seat 13, with no
# combination on crates.io that composed, after the same defect had been filed
# and correctly closed eight times.
#
# Every repository states the number in a top-level `PROTOCOL` file, one line
# (bl-3e57), and that is the only path fetched below. It used to be a Rust
# path per repository, and the engine moved its own out from under all four
# gates: a module split left the old file re-exporting the constant, which a
# build cannot notice and a regex cannot read, so every consumer's gate would
# have held forever on the very bump it was waiting for (thrall bl-c618).
#
# The overseer ruling is an ordering rule, not a protocol change: a release
# that RAISES PROTOCOL is held until the consumers' mains carry the new number.
# A release that moves no wire version is unaffected — it makes nothing worse
# than the skew already standing, and gating it would park every bugfix behind
# a lag it cannot fix.
#
# This job fetches four files — yog's `PROTOCOL` at the last release tag and at
# the pull request's head, and each consumer's on `main` — and hands the paths
# to `scripts/protocol-gate.sh judge`, which holds the whole decision and is
# proved both ways by `make protocol-gate` in the local gate. The workflow
# cannot run locally; the logic it spends can, and does on every `make lint`.
# The roster of consumers, and the one path all four are read at, live in that
# script and are not restated here.
#
# A hold is not a failure: the step exits 0, prints the verdict, and comments
# it once on the pull request. Every later CI run on that pull request
# re-judges — as does a `workflow_dispatch` of this workflow, which is the door
# for the case that actually happens, a consumer landing the constant hours
# after the last release-PR refresh.
#
# It reads the whole open set rather than the pull request the triggering run
# belongs to: the event is a wake-up, not the subject. That makes the workflow
# a reconciler — every wake-up re-judges the world — so a merge missed for any
# reason (a transient `mergeable: UNKNOWN`, a hold that has since cleared) is
# retried on the next wake-up rather than needing one of its own. Wake-ups are
# plentiful: release-plz refreshes the pull request on every push to main, and
# each refresh runs CI on it.
#
# The image leg needs nothing from here. `release-image` hangs off the release
# job's own outputs with `needs:` in the SAME workflow run (bl-6b96), so
# whatever reaches the release job reaches the image push; there is no separate
# trigger that could be left un-fired. The one act still outstanding on that
# leg — flipping the ghcr package to public after the first image publishes —
# is an operator act recorded in `release-plz.yml`'s setup notes, and no
# workflow can perform it.

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    # Release-PR runs only. A CI run on main is not this workflow's business,
    # and the glob cannot reach a branch with a slash in it.
    branches: ["release-plz-*"]
  # The re-run door. A protocol-gate hold clears when a CONSUMER repository
  # lands the constant, which is an event this repository never sees; without a
  # hand-wakeable trigger the release would wait for the next push to main to
  # refresh the pull request. Judging is idempotent and merging is guarded by
  # everything below, so an operator dispatch can only ever do what a CI run
  # would have done.
  workflow_dispatch:

# No ambient scopes. The job below claims exactly one — `contents: read`, for
# the checkout that puts `scripts/protocol-gate.sh` on disk — and every GitHub
# call it makes is still authenticated with RELEASE_PLZ_TOKEN, because
# GITHUB_TOKEN is exactly the token whose merge would strand the bump.
permissions: {}

jobs:
  merge:
    name: merge the release PR when CI is green
    # Never in a fork. `workflow_run` is not reachable from a fork pull request
    # in any case, but the guard is this repository's house style.
    if: github.repository_owner == 'mudbungie'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Two CI runs concluding at once (a re-run beside the original) would
    # otherwise race on one merge. Serialize; the loser re-lists and finds the
    # pull request already gone.
    concurrency:
      group: release-automerge
      cancel-in-progress: false
    # For the checkout alone. Every call to the GitHub API below spends
    # RELEASE_PLZ_TOKEN instead, so this grants nothing the merge path uses.
    permissions:
      contents: read
    steps:
      # The gate's own code, from the default branch — never from the pull
      # request, whose diff is a version bump and a changelog entry and has no
      # business supplying the check that judges it. `persist-credentials:
      # false` keeps GITHUB_TOKEN out of the local git config, which nothing
      # here needs.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Judge every open pull request, and merge a green release PR
        env:
          # The PAT, and only the PAT — see the header. Empty when the operator
          # has not set one, which the script reports and stops on.
          GH_TOKEN: ${{ secrets.RELEASE_PLZ_TOKEN }}
          GH_REPO: ${{ github.repository }}
          OWNER: ${{ github.repository_owner }}
          # The one marker that makes the gate's own comment findable again, so
          # a repeat is recognized rather than re-posted.
          MARKER: "<!-- protocol-gate -->"
        run: |
          set -euo pipefail

          if [ -z "${GH_TOKEN:-}" ]; then
            echo "RELEASE_PLZ_TOKEN is not set. Merging with GITHUB_TOKEN would"
            echo "land the version bump and trigger no CI run, so the release"
            echo "would never fire — merging nothing. Set the PAT or merge by hand."
            exit 0
          fi

          prs="$(gh pr list --state open --limit 50 \
            --json number,headRefName,headRefOid,isDraft,mergeable,mergeStateStatus,author,files)"

          count="$(jq 'length' <<<"$prs")"
          echo "open pull requests: $count"
          if [ "$count" -eq 0 ]; then
            echo "nothing to judge"
            exit 0
          fi

          # One line per pull request: number, head sha, verdict, merge state.
          # The verdict is decided here so the shell below merges or reports and
          # never re-decides.
          verdicts="$(jq -r --arg owner "$OWNER" '
            def release_files: ["Cargo.toml", "Cargo.lock", "CHANGELOG.md"];
            .[] | [
              .number,
              .headRefOid,
              (if (.headRefName
                   | test("^release-plz-[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}-[0-9]{2}-[0-9]{2}Z$")
                   | not)
                 then "skip: head \(.headRefName) is not a release-plz branch"
               elif (.author.login != $owner and .author.login != "app/github-actions")
                 then "skip: author \(.author.login) is neither the repository owner nor the Actions bot"
               elif .isDraft
                 then "skip: draft"
               elif ((.files | length) == 0)
                 then "skip: changes no files"
               elif (.files | map(select(.path as $p | release_files | index($p) | not)) | length) > 0
                 then "skip: touches \(.files | map(.path) | join(" ")), which is not a version bump"
               elif (.mergeable != "MERGEABLE")
                 then "hold: GitHub says mergeable=\(.mergeable)"
               else "candidate" end),
              .mergeStateStatus
            ] | @tsv' <<<"$prs")"

          while IFS=$'\t' read -r number sha verdict state; do
            [ -n "$number" ] || continue
            if [ "$verdict" != "candidate" ]; then
              printf 'PR %s  %s  [merge state %s]\n' "$number" "$verdict" "$state"
              continue
            fi
            # The CI WORKFLOW's verdict on this exact tree — the same question
            # release-plz.yml asks before publishing, and deliberately not the
            # pull request's check rollup, which a non-gating red macOS would
            # hold shut forever. Newest run first; `conclusion` is null while a
            # run is still going, which reads as "none" and holds.
            ci="$(gh api "repos/$GH_REPO/actions/workflows/ci.yml/runs?head_sha=$sha&per_page=1" \
              -q '.workflow_runs[0].conclusion // "none"')"
            if [ "$ci" != "success" ]; then
              printf 'PR %s  hold: CI on %s is %s  [merge state %s]\n' \
                "$number" "${sha:0:8}" "$ci" "$state"
              continue
            fi
            # The protocol gate (see the header). Four `PROTOCOL` files, and a
            # script that holds the whole decision. Absent files are the
            # fail-closed inputs the script judges — the fetches are `|| true`
            # and truncate first, so a missing release, a release predating the
            # file or a network fault reads as unreadable and holds rather than
            # merging.
            gate="$(mktemp -d)"
            file="$(scripts/protocol-gate.sh file)"
            raw() {
              gh api "repos/$1/contents/$3?ref=$2" \
                -H "Accept: application/vnd.github.raw" >"$4" || true
            }
            tag="$(gh api "repos/$GH_REPO/releases/latest" -q .tag_name || true)"
            # No previous release leaves `published` absent on purpose; the
            # script then judges the tree AS a bump, which the consumers can
            # clear and a hand does not have to.
            [ -z "$tag" ] || raw "$GH_REPO" "$tag" "$file" "$gate/published"
            raw "$GH_REPO" "$sha" "$file" "$gate/candidate"
            consumers=()
            while read -r repo; do
              [ -n "$repo" ] || continue
              raw "$repo" main "$file" "$gate/${repo##*/}"
              consumers+=("${repo##*/}=$gate/${repo##*/}")
            done < <(scripts/protocol-gate.sh roster)

            gate_rc=0
            gate_says="$(scripts/protocol-gate.sh judge \
              "$gate/published" "$gate/candidate" "${consumers[@]}")" || gate_rc=$?
            printf 'PR %s  protocol gate: %s\n' "$number" "$gate_says"
            if [ "$gate_rc" != 0 ]; then
              # Say it where the pull request is, once. Re-posting the same
              # sentence on every wake-up would bury the pull request, so the
              # gate's last comment is compared and a repeat is skipped.
              body="$MARKER
          **This release is held: it raises the wire protocol ahead of its consumers.**

          \`\`\`
          $gate_says
          \`\`\`

          yog is the only component that mints the wire protocol version; the seat
          (\`lernie\`), the foot (\`thrall\`) and the phone (\`yog-android\`) each vendor a
          copy of the constant, and the wire is fail-closed on a mismatch with no
          negotiation (\`docs/REMOTE.md\` §3). Publishing this bump first ships a suite
          that cannot compose on a clean box.

          Land the constant on the main of every repository named above. The next CI run
          on this pull request re-judges automatically; so does a \`workflow_dispatch\` of
          **Auto-merge release PR**, which is the door when the fix landed elsewhere."
              last="$(gh pr view "$number" --json comments \
                -q "[.comments[] | select(.body | startswith(\"$MARKER\")) | .body] | last // \"\"")"
              if [ "$last" = "$body" ]; then
                printf 'PR %s  held: the same comment already stands\n' "$number"
              else
                gh pr comment "$number" --body "$body"
                printf 'PR %s  held: commented\n' "$number"
              fi
              continue
            fi
            printf 'PR %s  merging: release PR, CI green on %s  [merge state %s]\n' \
              "$number" "${sha:0:8}" "$state"
            # A merge commit, which is how every release PR has landed here.
            # The push is the PAT's, so CI runs on main and the release fires.
            gh pr merge "$number" --merge
            printf 'PR %s  merged\n' "$number"
          done <<<"$verdicts"
