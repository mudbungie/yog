# Repo-wide tarpaulin defaults: applied by every `cargo tarpaulin` run,
# including the pre-commit hook.
#
# Pinned tarpaulin version: 0.35.2 (same pin as the litany repo).
# 0.35.3 was yanked, and 0.35.4+ silently excludes inline `#[cfg(test)] mod
# tests;` files from the coverable denominator. The 100% floor only means
# the same thing on every machine if everyone is on the same tarpaulin —
# upgrade in lockstep (this file + Makefile preflight) or the floor gets
# quietly weaker on whichever side moves first.
#
# - `src/main.rs` is the process edge: the multi-call argv match, the two
#   world hatches, and one call into `Engine::serve` — which is itself a
#   tested function (bl-269a). Everything it reaches is covered.
# - **`src/shell/*` is gone with the exclusion** (bl-7942). It was the egui
#   interaction glue, whose `.clicked()` branches were unreachable headless;
#   the crate has no face at all now, so there is nothing left that a test
#   cannot drive. **One exclusion, and it is the process edge** — the only
#   class this list has ever admitted.
# - `ignore-panics` excludes branches that only fire on programmer-error
#   panics (e.g. `.expect(...)` on infallible operations).
#
# `engine = "Llvm"` is the one engine setting, and it lives here because 0.35.2
# ignores `--engine` on the command line whenever this file exists: the merge
# never copies it, so the Makefile's former `--engine llvm` ran ptrace (the
# Linux default) silently, every run until bl-d147. ptrace resolves a
# dependency's relative `src/<name>.rs` DWARF rows to OUR file of the same
# name, so a non-code line of ours can read as uncovered — a phantom no glob
# can exclude. llvm reads the profile's own paths and also counts untaken
# branches ptrace never saw, which is a stricter floor, not a weaker one.
#
# Coverage runs serially (`args = ["--test-threads=1"]`): Y3's
# `spawn_detached` (§8.1) forks `setsid` children that tarpaulin followed
# under ptrace — the engine that actually ran until bl-d147 — and its state
# machine raced the parallel teardown of those detached processes ("Failed
# to find process for pid: … → segfault" — the same failure litany's
# tarpaulin pins around). Serial coverage sidesteps the race; the 100% floor is
# unchanged (coverage is the union of executed lines, order-independent).
#
# `cargo test` (i.e. `make test`) itself stays PARALLEL: the ETXTBSY fork race
# that once also forced serial is fixed at its root — `crate::git_env` is the
# crate's one fork and takes the binary-wide spawn lock across it under
# `cfg(test)` (bl-6397, `rules/no-bare-fork.yml`). Only tarpaulin's own ptrace
# bookkeeping needs the pin. Note that `--test-threads=1` was never itself a
# cure for that race and must not be read as one: a serial suite still has
# yog's OWN worker threads forking beside the one test thread, which is how the
# race reached a coverage run at all.
[default]
engine = "Llvm"
exclude-files = ["src/main.rs"]
ignore-panics = true
timeout = "300s"
args = ["--test-threads=1"]
